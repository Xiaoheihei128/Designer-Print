<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenPrint</title>
<style>/* ============ OpenPrint 渲染样式（自动生成，勿手改） ============ */
:root {
  --op-page-w: 210mm;
  --op-page-h: 297mm;
  --op-scale: 1;
  --op-table-border: #333333;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #f0f2f5;
  /* 让底色/斑马纹在打印时不被浏览器"省墨"策略抹掉 */
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.op-doc {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10mm; padding: 10mm 0;
}

/* 缩放外壳：transform 不占布局空间，靠外壳撑出滚动区域 */
.op-page-wrap {
  width: calc(var(--op-page-w) * var(--op-scale));
  height: calc(var(--op-page-h) * var(--op-scale));
  flex: none;
}

.op-page {
  position: relative;
  width: var(--op-page-w);
  height: var(--op-page-h);
  overflow: hidden;
  background: #ffffff;
  transform: scale(var(--op-scale));
  transform-origin: top left;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
}

/* 水印装饰层：绝对铺满页面、不拦截事件、置于内容之下 */
.op-watermark {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.op-watermark.op-wm-single {
  display: flex;
  align-items: center;
  justify-content: center;
}
.op-wm-single > span {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
}

/* 整页相对坐标：正文控件直接相对物理页 0,0 定位；边距仅作可视化参考线，不参与渲染偏移 */
.op-content {
  position: absolute;
  left: 0mm;
  top: 0mm;
  width: 210mm;
  /* 正文区 = 整页：控件可落在任意位置（含原边距带），所见即所得 */
  height: 297mm;
}

.op-section {
  position: absolute;
  width: 210mm;
  /* 不裁剪：边距只作设计辅助参考线，渲染时边距内/外内容均可见（所见即所得） */
  overflow: visible;
}
/* 页眉/页脚：直接挂在 .op-page 上，整页相对（左右贴物理页边） */
.op-header { top: 0mm; left: 0mm; height: 0mm; }
.op-footer { bottom: 0mm; left: 0mm; height: 0mm; }
/* 正文：填满 .op-content（整页），不再叠加边距偏移 */
.op-body { top: 0mm; left: 0mm; width: 100%; height: 100%; }

/* -------------------------------- 控件 -------------------------------- */

.op-node {
  position: absolute;
  transform-origin: left top;
}

/* 标签网格参考线：与 .op-node 同一坐标原点（.op-content 左上角），
   若无 position:absolute 会按文档流竖排成一列，造成「网格线挤成一列」的视觉 bug */
.op-gridlines {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.op-gridline {
  position: absolute;
  box-sizing: border-box;
  pointer-events: none;
}

.op-text {
  overflow: hidden;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: break-word;
  font-family: "Source Han Sans CN", "PingFang SC", sans-serif;
  font-size: 12pt;
  line-height: 1.16;
  color: #000000;
}

.op-richtext {
  overflow: hidden;
  font-family: "Source Han Sans CN", "PingFang SC", sans-serif;
  font-size: 12pt;
  line-height: 1.5;
  color: #000000;
}
.op-richtext > *:first-child { margin-top: 0; }
.op-richtext > *:last-child { margin-bottom: 0; }
.op-richtext img { max-width: 100%; }

.op-image { display: block; }
.op-image > img { display: block; width: 100%; height: 100%; }

/* 条码 / 二维码：SVG 矢量填满控件框（宽高独立，所见即所得）。
   条码的 preserveAspectRatio="none" 由 data-binder 注入 SVG 自身（自然尺寸≈控件尺寸，拉伸量≈1）；
   二维码保留默认 contain（100%×100% meet）居中。 */
.op-code > svg { display: block; width: 100%; height: 100%; }

/* ★ 段级形态容器（cell 内嵌的 svg/img）：
   - 容器是 <span> 默认 display:inline → inline 元素忽略 width/height 样式，
     SVG 用 viewBox 原始尺寸渲染，撑爆 cell，行被 CSS overflow:hidden 切。
   - 改 inline-block:让 height/width 样式生效,SVG 内的 100% 才有计算基。
   - max-width:100% + vertical-align:middle:与同行文字基线对齐,混排场景(文字+二维码段)不跑版。 */
.op-code-seg, .op-image-seg {
  display: inline-block;
  vertical-align: middle;
  max-width: 100%;
}
.op-code-seg > svg { display: block; width: 100%; height: 100%; }

.op-line > span {
  position: absolute;
  display: block;
}

/* 解析失败占位：必须看得见，避免用户拿到"少了一块"的单据而不自知 */
.op-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #c0c4cc;
  color: #a8abb2;
  font-family: "Source Han Sans CN", "PingFang SC", sans-serif;
  font-size: 8pt;
  overflow: hidden;
}

/* -------------------------------- 表格 -------------------------------- */

.op-table {
  /* 用 separate + border-spacing:0 + box-sizing:border-box，让外框落在表格盒"内"侧：
     collapse 模式下外框横跨边缘，被 overlay 的 overflow:hidden 切掉右/下边，
     表现为"需拖一下才看得到边框"；separate 方案使四边始终完整可见（设计/打印一致）。 */
  border-collapse: separate;
  border-spacing: 0;
  box-sizing: border-box;
  table-layout: fixed;
  /* 字体三件套必须与 DomMeasurer 完全一致，否则分页高度会失真 */
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  font-size: 9pt;
  line-height: 1.35;
  color: #1f2329;
}

.op-table td,
.op-table th {
  padding: 1.2mm 2mm;
  overflow: hidden;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: break-word;
  font-weight: normal;
  text-align: left;
  vertical-align: middle;
}

/* 垂直对齐：vertical-align 不可继承，只能按表加类下发到每个 td */
.op-table.va-top td { vertical-align: top; }
.op-table.va-middle td { vertical-align: middle; }
.op-table.va-bottom td { vertical-align: bottom; }

.op-table tr.is-header td { font-weight: bold; }
.op-table tr.is-group td { background: #F5F7FA; font-weight: bold; }
.op-table tr.is-subtotal td,
.op-table tr.is-summary td { font-weight: bold; }
.op-table tr.is-striped td { background: #DCE6F4; }
/* 静态行（布局网格正文 / 数据表备注尾行）：默认无强调样式，
   单元格视觉以内联样式为准（与设计期 overlay 同一套 resolveCellStyleFor 取值） */
.op-table tr.is-static td { /* 占位：保持类名与设计期对齐，避免样式遗漏 */ }
/* 补空白行（P0-2 按纸张填满）：无内容、无背景，但保留上下边框横线，
   让补空行视觉上"是表格的一行"（供手写 / 签字栏留白用）。
   ★ 不覆盖 padding（用默认内边距）：padding:0 + overflow:hidden + 空内容
   的组合在某些浏览器里会导致 cell 内容区塌陷，:last-child 上的 border-right
   渲染失败（实测 5 列表格补空行最右列右侧边线缺失）。
   ★ 显式补 border-right：高优先级兜底，万一 :last-child 规则因空白 td
   渲染异常没命中，blank 行视觉仍是完整的"表格一列"。 */
.op-table tr.is-blank td { background: transparent; }
.op-table.b-all tr.is-blank td:last-child { border-right: 0.2mm solid var(--op-table-border); }

/* ---------- 表格样式预设（Excel 式快速切换；class 由渲染端挂在 table 元素上） ---------- */
/* 默认（none）：仅表头加粗，无任何背景色（含标题行）。无需规则，class 仅作占位。 */

/* 表头高亮：表头浅灰底 */
.op-table.ts-header tr.is-header td { background: #F5F7FA; }

/* 斑马纹（单双变色条纹，浅蓝交替，对比更明显） */
.op-table.ts-zebra tr.is-header td { background: #F5F7FA; }
.op-table.ts-zebra tbody tr:not(.is-header):nth-child(even) td { background: #DCE6F4; }

/* 斑马纹·蓝（交替行更深蓝） */
.op-table.ts-zebra-blue tr.is-header td { background: #F5F7FA; }
.op-table.ts-zebra-blue tbody tr:not(.is-header):nth-child(even) td { background: #C2D4EE; }

/* 斑马纹·灰（中性灰交替） */
.op-table.ts-zebra-gray tr.is-header td { background: #F5F7FA; }
.op-table.ts-zebra-gray tbody tr:not(.is-header):nth-child(even) td { background: #E4E7EB; }

/* 绿色表头（绿底白字） */
.op-table.ts-header-green tr.is-header td { background: #1F9D57; color: #ffffff; }

/* 隔列着色（奇偶列交替底） */
.op-table.ts-banded-cols tr > *:nth-child(even) { background: #EEF2F8; }

/* 三段式：表头高亮 + 合计 / 总计行强调底（设计期聚合尾行已对齐 is-subtotal/is-summary 类） */
.op-table.ts-three-segment tr.is-header td { background: #F5F7FA; }
.op-table.ts-three-segment tr.is-subtotal td,
.op-table.ts-three-segment tr.is-summary td { background: #EBF2FF; }

/* 深底表头：深蓝底白字 */
.op-table.ts-header-dark tr.is-header td { background: #2F54EB; color: #ffffff; }

/* 课表：全网格 + 表头淡底高亮（角标斜线由单元格 diagonal 控制） */
.op-table.ts-timetable tr.is-header td { background: #F5F7FA; }

/* 边框模式：每格画上/左边框，末行补下、末列补右 → 外框落在盒内、不被裁切 */
.op-table.b-all td { border-top: 0.2mm solid var(--op-table-border); border-left: 0.2mm solid var(--op-table-border); }
.op-table.b-all tr:last-child td { border-bottom: 0.2mm solid var(--op-table-border); }
.op-table.b-all td:last-child { border-right: 0.2mm solid var(--op-table-border); }
/* Bug11 修复：vMerge 锚点（rowspan>1）不在末行，但其视觉下沿落在末行底边。
   tr:last-child td 不命中锚点 → 末行 vMerge 列无下边框。补一条专属规则 */
.op-table.b-all td[rowspan] { border-bottom: 0.2mm solid var(--op-table-border); }
.op-table.b-horizontal td { border-top: 0.2mm solid var(--op-table-border); }
.op-table.b-horizontal tr:last-child td { border-bottom: 0.2mm solid var(--op-table-border); }
.op-table.b-horizontal td[rowspan] { border-bottom: 0.2mm solid var(--op-table-border); }
.op-table.b-outline { border: 0.2mm solid var(--op-table-border); }
.op-table.b-none td { border: 0; }
/* 三线表：顶线 + 表头底线 + 底线，无内部横线、无竖线（建模报告 / 财务报表常用） */
.op-table.b-three-line { border-top: 0.2mm solid var(--op-table-border); border-bottom: 0.2mm solid var(--op-table-border); }
.op-table.b-three-line tr.is-header:last-child td { border-bottom: 0.2mm solid var(--op-table-border); }

/* vMerge 同值合并（设计画布视觉提示）—— 启用列加蓝色左竖条，
   让用户在画布上一眼看到「这列会去重纵向合并」；运行期 HTML 输出由
   rowspan 自然折叠重复单元格，不再额外画线 */
.op-table td.is-vmerge-col { box-shadow: inset 2px 0 0 rgba(37, 99, 235, 0.55); }
